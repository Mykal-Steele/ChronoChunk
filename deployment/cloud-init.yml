#cloud-config
# First-boot setup for the bot's VM: Docker, swap, and the repo checkout. Works on any
# Ubuntu VM that runs cloud-init. On Google Cloud, pass it as user-data:
#   gcloud compute instances create ... --metadata-from-file user-data=deployment/cloud-init.yml
package_update: true
package_upgrade: true
packages:
  - docker.io
  - docker-compose-v2
  - docker-buildx
  - git

# The container runs as uid 1000, so the files it writes in /opt/chronochunk/data need
# that owner. Creating this user first gives it uid 1000. SSH users added later get others.
users:
  - default
  - name: chrono
    uid: "1000"
    shell: /bin/bash

# The VM has 1 GiB of RAM, so image builds need swap.
swap:
  filename: /swapfile
  size: 2G
  maxsize: 2G

# Swap only under real memory pressure. At the default of 60 the kernel moved the idle bot to
# the swap file while half the RAM was free, and the next slash command took longer than
# Discord's 3 seconds to answer while it was read back from disk.
write_files:
  - path: /etc/sysctl.d/90-chronochunk.conf
    content: |
      vm.swappiness = 10

# Load only the bot's settings file. Reloading every sysctl file would also apply Google's
# 60-gce-network-security.conf, which turns off the IP forwarding Docker needs, and the
# container would lose the internet.
runcmd:
  - sysctl -p /etc/sysctl.d/90-chronochunk.conf
  - systemctl enable --now docker
  - usermod -aG docker chrono
  - install -d -o chrono -g chrono /opt/chronochunk /opt/chronochunk/data /opt/chronochunk/data/user_data /opt/chronochunk/data/logs /opt/chronochunk/data/state
  - sudo -u chrono git clone --branch main https://github.com/Mykal-Steele/ChronoChunk /opt/chronochunk/app
