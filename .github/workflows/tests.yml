name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The test stage is the bot's image plus pytest: pandoc, the fonts and every pinned package
      - name: Build the test image
        run: docker build --target test -t chronochunk:test .

      # The image has no source in it, so the checkout is mounted, and everything runs as the
      # user who owns the checkout
      - name: Lint
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD":/app -w /app chronochunk:test
          ruff check . --no-cache

      - name: Check the types
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD":/app -w /app chronochunk:test
          pyright

      - name: Run the tests
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD":/app -w /app chronochunk:test
          python -m pytest tests/unit tests/integration -q -p no:cacheprovider

      # The image that gets deployed has to build too
      - name: Build the bot image
        run: docker build -t chronochunk:latest .
