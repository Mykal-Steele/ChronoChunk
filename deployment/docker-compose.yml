# Runs the bot on its VM (a Google e2-micro since 2026-11, an Azure VM before).
# On the host this file sits at /opt/chronochunk/docker-compose.yml, next to
# .env and the git checkout in ./app. User data, logs and the AI spending
# ledger stay in ./data so a rebuild never touches them.
services:
  bot:
    build: ./app
    image: chronochunk
    container_name: chronochunk
    restart: unless-stopped
    env_file: .env
    # These win over the same names in .env
    environment:
      # Gemini on Vertex AI. The bot signs in as the VM's service account, so no key is stored.
      AI_PROVIDER: vertex
      VERTEX_PROJECT: adorio
      # Normal chat and the jobs behind the reply
      AI_CHAT_MODEL: gemini-3.1-flash-lite
      # Study sets, detailed answers, rewrites and documents
      AI_HEAVY_MODEL: gemini-3.8-flash
      AI_CHAT_REASONING_EFFORT: low
      # To go back to Azure, put AZURE_OPENAI_ENDPOINT and AZURE_OPENAI_KEY in .env and use
      # these lines instead of the ones above:
      #   AI_PROVIDER: azure
      #   AZURE_OPENAI_DEPLOYMENT: gpt-6-luna
      #   AZURE_OPENAI_BACKGROUND_DEPLOYMENT: gpt-5-nano
      #   AI_CHAT_REASONING_EFFORT: none
      # Embeds a question about the course material. The sync embeds the material with the same
      # model. Without a courses.db in ./data/state the bot never calls it.
      EMBEDDING_DEPLOYMENT: text-embedding-3-small
    # Runs as the unprivileged user from the Dockerfile, with nothing it could use to become root
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # The bot idles at about 40 MB. A PDF or a song adds a few hundred for a moment.
    # The cap stops a runaway from taking the 1 GiB VM, and SSH, down with it.
    mem_limit: 640m
    memswap_limit: 1536m
    pids_limit: 256
    volumes:
      - ./data/user_data:/app/user_data
      - ./data/logs:/app/logs
      - ./data/state:/app/state
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 1m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
