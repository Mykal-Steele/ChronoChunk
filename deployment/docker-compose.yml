# Runs the bot on the Azure VM.
# On the host this file sits at /opt/chronochunk/docker-compose.yml, next to
# .env and the git checkout in ./app. User data, logs and the AI spending
# ledger stay in ./data so a rebuild never touches them.
services:
  bot:
    build: ./app
    image: chronochunk
    container_name: chronochunk
    restart: unless-stopped
    env_file: .env
    # These win over the same names in .env
    environment:
      # The chat model. gpt-6-luna only takes tool calls with reasoning switched off.
      AZURE_OPENAI_DEPLOYMENT: gpt-6-luna
      AI_CHAT_REASONING_EFFORT: none
      # The cheap model for jobs that run behind the reply. Remove this line if the Azure
      # resource has no gpt-5-nano deployment.
      AZURE_OPENAI_BACKGROUND_DEPLOYMENT: gpt-5-nano
    # Runs as the unprivileged user from the Dockerfile, with nothing it could use to become root
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # The bot idles at about 40 MB. A PDF or a song adds a few hundred for a moment.
    # The cap stops a runaway from taking the 1 GiB VM, and SSH, down with it.
    mem_limit: 640m
    memswap_limit: 1536m
    pids_limit: 256
    volumes:
      - ./data/user_data:/app/user_data
      - ./data/logs:/app/logs
      - ./data/state:/app/state
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 1m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
