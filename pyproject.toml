# Settings for the linter and the type checker. Both run in CI, see .github/workflows/tests.yml.

[tool.ruff]
target-version = "py312"
line-length = 140
extend-exclude = ["venv"]

[tool.ruff.lint]
# Rules that find bugs, not style: pyflakes, the pycodestyle errors, bugbear, blocking calls
# in async code, pylint's errors, a task nobody keeps a reference to, and `x: str = None`.
select = ["E4", "E7", "E9", "F", "B", "ASYNC", "PLE", "RUF006", "RUF013"]
ignore = [
    "E731",  # the rate limit gates are one-line lambdas on purpose
]

[tool.ruff.lint.per-file-ignores]
# These put the project root on sys.path, or set the environment, before the project imports
"run.py" = ["E402"]
"src/bot.py" = ["E402"]
"tests/*" = ["E402"]

[tool.pyright]
include = ["src", "config", "run.py", "sync"]
# These need the browser package, which only the sync's own environment has
exclude = ["sync/session.py", "sync/sharepoint.py", "sync/probes"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
